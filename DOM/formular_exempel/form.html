<body>
    <div class="container p-3">
        <p><a href="../exempel-1-formular.html">← Tillbaka till exempel 1</a></p>
        <h1>Registrera användaruppgifter</h1>
        <p>Skriv in ditt namn och e-post. Klicka sedan på knappen för att bli registrerad.</p>
        <form id="registration-form" method="post" action="register.php">
            <div class="form-group">
                <label>Förnamn</label>
                <input type="text" id="firstname" name="firstname" class="form-control">
            </div>
            <div class="form-group">
                <label>Efternamn</label>
                <input type="text" id="lastname" name="lastname" class="form-control">
            </div>
            <div class="form-group">
                <label>E-post</label>
                <input type="text" id="email" name="email" class="form-control">
            </div>
            <button type="submit" class="btn btn-primary">Skicka registrering</button>
        </form>
    </div>
    <script src="scripts/validate_form.js"></script>

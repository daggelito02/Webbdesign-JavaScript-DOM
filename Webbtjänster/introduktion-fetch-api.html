<!DOCTYPE html>
<html lang="sv">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Introduktion till Fetch API</title>
	<link rel="stylesheet" href="../style.css">
</head>
<body>
	<p class="back-link"><a href="index.html">← Till Tema 5</a></p>
	<h1>Introduktion till Fetch API</h1>
	<p>
		<a href="https://www.canvas.umu.se/courses/22826/modules/items/933409" 
		target="_blank" rel="noopener noreferrer">
		Öppna sidan i Canvas 
			<span aria-hidden="true" class="external-link-icon">↗</span>
		</a>
	</p>
	<h1>Användarinformation</h1>
    <button id="fetch-user">Hämta användardata</button>
    <div id="user-info"></div>
	<div id="user-new-info"></div>
    <script>
        // Globala variabler som alla funktioner kan komma åt
        let userInfoDiv;
		let userNewInfoDiv;

        // Vänta tills DOM:en är redo
        document.addEventListener('DOMContentLoaded', function() {
            // Här ska Fetch-applikationen konfigureras
			const fetchButton = document.getElementById('fetch-user');
            userInfoDiv = document.getElementById('user-info'); // Tilldela till global variabel
            userNewInfoDiv = document.getElementById('user-new-info'); // Tilldela till global variabel
            fetchButton.addEventListener('click', function() {
                //getUserInfo();
				getUserInfoAsyncAwait();
            });
        });

        function getUserInfo() {
            //Här ska användardatan hämtas
			// Visa en laddningsindikator
            userInfoDiv.innerHTML = '<p>Laddar användardata...</p>';
            
            // Gör fetch-anropet
            fetch('https://jsonplaceholder.typicode.com/users/1')
            .then(response => {
				// Kontrollera om anropet lyckades
				if (!response.ok) {
					throw new Error('Nätverksfel: ' + response.status);
				}
				return response.json();
			})
			.then(userData => {
				// Visa den hämtade datan
				showUserInfo(userData);
			})
			.catch(error => {
				// Hantera fel
				userInfoDiv.innerHTML = '<p style="color: red;">Fel vid hämtning: ' + error.message + '</p>';
				console.error('Fel:', error);
			});
        }

        async function getUserInfoAsyncAwait() {
			try {
				// Visa laddningsindikator
				userInfoDiv.innerHTML = '<p>Laddar användardata...</p>';
				
				// Vänta på att fetch-anropet ska slutföras
				const response = await fetch('https://jsonplaceholder.typicode.com/users/1');
				
				// Kontrollera om anropet lyckades
				if (!response.ok) {
					throw new Error('Nätverksfel: ' + response.status);
				}
				
				// Vänta på att JSON-parsningen ska slutföras
				const userData = await response.json();
				
				// Visa resultatet
				showUserInfo(userData);
				
			} catch (error) {
				// Hantera fel
				userInfoDiv.innerHTML = '<p style="color: red;">Fel vid hämtning: ' + error.message + '</p>';
				console.error('Fel:', error);
			}
		}
		
		function showUserInfo(userData) {
            // Här ska användardatan presenteras på sidan
			const html = `
                <div style="border: 1px solid #ddd; padding: 15px; margin-top: 10px;">
                    <h2>${userData.name}</h2>
                    <p><strong>Användarnamn:</strong> ${userData.username}</p>
                    <p><strong>E-post:</strong> ${userData.email}</p>
                    <p><strong>Telefon:</strong> ${userData.phone}</p>
                    <p><strong>Webbsida:</strong> ${userData.website}</p>
                    <p><strong>Företag:</strong> ${userData.company.name}</p>
                </div>
            `;
            
            userNewInfoDiv.innerHTML = html;
        }

		function showUserInfo(showNewuserData) {
            // Här ska användardatan presenteras på sidan
			const html = `
                <div style="border: 1px solid #ddd; padding: 15px; margin-top: 10px;">
                    <h2>${showNewuserData.name}</h2>
                    <p><strong>Användarnamn:</strong> ${showNewuserData.username}</p>
                    <p><strong>E-post:</strong> ${showNewuserData.email}</p>
                    <p><strong>Telefon:</strong> ${showNewuserData.phone}</p>
                    <p><strong>Webbsida:</strong> ${showNewuserData.website}</p>
                    <p><strong>Företag:</strong> ${showNewuserData.company.name}</p>
                </div>
            `;
            
            userInfoDiv.innerHTML = html;
        }

		async function createUser(userData) {
			try {
				const response = await fetch('https://jsonplaceholder.typicode.com/users', {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json',
					},
					body: JSON.stringify(userData)
				});
				
				if (!response.ok) {
					throw new Error('Kunde inte skapa användare: ' + response.status);
				}
				
				const newUser = await response.json();
				console.log('Användare skapad:', newUser);
				showUserInfo(newUser); // Visa den nya användaren på sidan
				return newUser;
				
			} catch (error) {
				console.error('Fel vid skapande av användare:', error);
				throw error;
			}
		}

		// Exempel på användning:
		const newUserData = {
			name: 'Anna Andersson',
			username: 'anna.andersson',
			email: 'anna@example.com',
			userData: 1,
			company: {
				name: 'Exempel AB'
			}
		};

		createUser(newUserData);

   </script>
</body>
</html>
